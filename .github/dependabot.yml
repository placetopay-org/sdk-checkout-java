version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      jackson:
        patterns: ["com.fasterxml.jackson*"]
      testing:
        patterns: ["org.junit*", "org.assertj*", "org.wiremock*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
